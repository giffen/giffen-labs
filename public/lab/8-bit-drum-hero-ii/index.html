(() => {

const SNARE = 0, HAT = 1, TOM = 2, CRASH = 3, KICK = 4;

const KEYMAP = { KeyD: SNARE, KeyF: HAT, KeyJ: TOM, KeyK: CRASH, Space: KICK };

// ============ SONGS ============

// Bass/arp: chord degrees per 16th ('1' root, '3' third, '5' fifth, '8' octave), '-' holds, '.' rests.
// Lead: NOTE:sixteenths tokens, '.' for a rest.
const SONGS = [
  {

  {

      I: { bars: 2, chords: 'Am Am', d: { k: 'x...x...x...x...', h: '..x...x...x...x.', c: 'x' }, bass: '1.8.1.8.1.8.1.8.' },
      V: { bars: 4, chords: 'Am Dm G C',
        d: { k: 'x...x...x...x...', s: '....x.......x...', h: '..x...x...x...x.' },
        bass: '1.8.1.8.1.8.1.8.', arp: '1.3.5.8.1.3.5.8.',
        lead: 'E5:3 E5:1 .:2 D5:2 C5:4 .:4 F5:3 F5:1 .:2 E5:2 D5:4 .:4 D5:2 B4:2 G4:2 B4:2 D5:4 G5:4 E5:8 .:8' },
      C: { bars: 4, chords: 'F G Em Am',
        d: { k: 'x...x...x...x...', s: '....x.......x..x', h: 'x.x.x.x.x.x.x.x.', c: 'x' },
        f: { k: 'x...x...x...x...', s: 'x.x.x.x.........', t: '........x.x.x.x.' },
        bass: '1.8.1.8.1.8.1.8.', arp: '1358135813581358',
        lead: 'A4:2 C5:2 F5:4 E5:2 C5:2 A4:4 B4:2 D5:2 G5:4 F5:2 D5:2 B4:4 G4:2 B4:2 E5:4 D5:2 B4:2 G4:4 A4:4 C5:4 E5:6 .:2' },
      B: { bars: 4, chords: 'Dm Dm E E',

    sections: {
      I: { bars: 2, chords: 'C G', d: { k: 'x.......x.......', h: 'x.x.x.x.x.x.x.x.' }, bass: '1-..5-..8-..5-..' },
      A: { bars: 4, chords: 'C Am F G',
        d: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', c: 'x' },
        bass: '1-..5-..8-..5-..',
        lead: 'E5:2 G5:2 E5:2 C5:2 D5:4 E5:4 C5:2 A4:2 C5:2 E5:2 D5:8 C5:2 A4:2 F4:2 A4:2 C5:4 D5:4 B4:4 G4:4 B4:2 D5:6' },

        d: { k: 'x.....x.x.......', s: '....x.......x...', t: '..x...x...x...x.', c: 'x' },
        f: { k: 'x.......x.......', s: 'x.x.x.x.', t: '........x.x.x.x.' },

        lead: 'F5:2 E5:2 C5:2 A4:2 C5:4 F5:4 G5:2 F5:2 D5:2 B4:2 D5:4 G5:4 E5:2 D5:2 B4:2 G4:2 B4:4 E5:4 A5:6 G5:2 E5:4 C5:4' },
      O: { bars: 1, chords: 'C', d: { k: 'x', c: 'x' }, bass: '1---------------', lead: 'C5:16' },
    },
  },
  {
    id: 'boss', title: 'FINAL BOSS', bpm: 152, stars: 4, form: 'I V C V C B C C O',
    sections: {
      I: { bars: 2, chords: 'Dm Dm', d: { k: 'x.x.x.x.x.x.x.x.', c: 'x' },
        f: { k: 'x.x.x.x.', s: '........x.x.x.x.' }, bass: '1.1.1.1.1.1.1.1.' },
      V: { bars: 4, chords: 'Dm Bb C A',
        d: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', c: 'x' },
        bass: '1.1.1.1.1.1.1.1.', arp: '1358853113588531' },
      C: { bars: 4, chords: 'Dm Bb C A',
        d: { k: 'x.x...x.x.x...x.', s: '....x.......x...', c: 'x...x...x...x...' },
        f: { k: 'x.......x.......', s: 'x.x.x.x.', t: '........x.x.x.x.' },
        bass: '1.1.8.1.1.1.8.1.', arp: '1358853113588531',
        lead: 'D5:2 F5:2 A5:2 F5:2 D5:2 F5:2 A5:2 C6:2 D6:4 C6:2 Bb5:2 A5:4 F5:4 G5:2 E5:2 C5:2 E5:2 G5:4 A5:2 G5:2 A5:8 C#6:4 E6:4' },
      B: { bars: 4, chords: 'Bb Bb A A',
        d: { k: 'x.......x..x....', s: '........x.......', h: 'x...x...x...x...', c: 'x' },
        f: { k: 'x.x.x.x.x.x.x.x.', s: '........x.x.x.x.' },
        bass: '1-------1---5---', lead: 'F5:16 D5:16 E5:16 C#5:16' },
      O: { bars: 1, chords: 'Dm', d: { k: 'x', c: 'x' }, bass: '1---------------', lead: 'D5:16' },
    },
  },
];

const NOTE_PC = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
function noteMidi(n) { const m = /^([A-G][#b]?)(\d)$/.exec(n); return 12 * (+m[2] + 1) + NOTE_PC[m[1]]; }
function parseChord(s) { const m = /^([A-G][#b]?)(.*)$/.exec(s); return { pc: NOTE_PC[m[1]], q: m[2] }; }
function degree(ch, d) {
  const minor = ch.q.startsWith('m') && !ch.q.startsWith('maj');
  return { 1: 0, 2: 2, 3: minor ? 3 : 4, 4: 5, 5: 7, 6: 9, 7: ch.q.includes('maj7') ? 11 : 10, 8: 12 }[d];
}
function patAt(p, i) { return p.length % 16 === 0 ? p[i % p.length] : (p[i] || '.'); }

function keepNote(lane, pos, diff, bpm) {
  if (diff === 2) return true;
  if (diff === 1) return pos % 2 === 0 && !(lane === HAT && bpm >= 140 && pos % 4);
  return pos % 4 === 0 && lane !== HAT;
}

function buildSong(song, diff, speed) {
  const spb = 60 / (song.bpm * speed), sw = song.swing || 0;
  const OFF = [0, 0.25 + sw / 12, 0.5 + sw / 6, 0.75 + sw / 12];
  const T = st => (Math.floor(st / 4) + OFF[st % 4]) * spb;
  const notes = [], music = [];
  let step = 0;
  for (const name of song.form.split(' ')) {
    const sec = song.sections[name], n = sec.bars * 16;
    const chords = sec.chords.split(' ').map(parseChord);
    const chordAt = i => chords[Math.floor(i / 16) % chords.length];
    for (let i = 0; i < n; i++) {
      const fill = sec.f && i >= n - 16, src = fill ? sec.f : sec.d, idx = fill ? i % 16 : i;
      const lanes = [];
      for (const key in CHART_LANE) {
        if (src[key] && patAt(src[key], idx) === 'x' && keepNote(CHART_LANE[key], i % 16, diff, song.bpm)) lanes.push(CHART_LANE[key]);
      }
      // a crash replaces the hat: drummers have two hands
      if (lanes.includes(CRASH) && lanes.includes(HAT)) lanes.splice(lanes.indexOf(HAT), 1);
      for (const lane of lanes) notes.push({ t: T(step + i), lane, res: 0 });
    }
    for (const [pat, v, base] of [[sec.bass, 'bass', 36], [sec.arp, 'arp', 60]]) {
      if (!pat) continue;
      for (let i = 0; i < n; i++) {
        const c = patAt(pat, i);
        if (c === '.' || c === '-') continue;
        let e = i + 1;
        while (e < n && patAt(pat, e) === '-') e++;
        const ch = chordAt(i);
        music.push({ t: T(step + i), d: (T(step + e) - T(step + i)) * 0.92, v, m: base + ch.pc + degree(ch, c) });
      }
    }
    if (sec.lead) {
      let c = 0;
      for (const tok of sec.lead.split(' ')) {
        const [nm, len] = tok.split(':');
        if (nm !== '.') music.push({ t: T(step + c), d: (T(step + c + +len) - T(step + c)) * 0.95, v: 'lead', m: noteMidi(nm) });
        c += +len;
      }
      if (c !== n) console.warn('lead length mismatch', song.id, name, c, n);
    }
    step += n;
  }
  notes.sort((a, b) => a.t - b.t || a.lane - b.lane);
  music.sort((a, b) => a.t - b.t);
  const songLen = T(step);
  return { notes, music, spb, songLen, end: songLen + 1.2 };
}

// ============ STORAGE ============
const store = {
  get(k, d) { try { const v = localStorage.getItem('dh2.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dh2.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const settings = Object.assign({ calib: 0, song: 0, diff: 1, speed: 0 }, store.get('settings', {}));
// saved settings can outlive the song list
settings.song = Math.min(Math.max(settings.song | 0, 0), SONGS.length - 1);
settings.diff = Math.min(Math.max(settings.diff | 0, 0), 2);
settings.speed = Math.min(Math.max(settings.speed | 0, 0), SPEEDS.length - 1);
settings.calib = Math.min(Math.max(+settings.calib || 0, -250), 250);
const best = store.get('best', {});
const saveSettings = () => store.set('settings', settings);

// ============ AUDIO ENGINE ============
let ac = null, master, drumBus, noiseBuf, crunchBuf, pulse25, pulse125;

function audioInit() {
  if (ac) { if (ac.state === 'suspended' && !paused) ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC({ latencyHint: 'interactive' });
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.12;
  master = ac.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(ac.destination);
  drumBus = ac.createGain(); drumBus.connect(master);
  noiseBuf = makeNoise(1); crunchBuf = makeNoise(3);
  pulse25 = pulseWave(0.25); pulse125 = pulseWave(0.125);
}

// held noise: each random value repeats `hold` samples, which is where the 8-bit grit comes from
function makeNoise(hold) {
  const len = ac.sampleRate * 2, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
  let v = 0;
  for (let i = 0; i < len; i++) { if (i % hold === 0) v = Math.random() * 2 - 1; d[i] = v; }
  return b;
}
function pulseWave(duty) {
  const N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) re[n] = 2 / (n * Math.PI) * Math.sin(n * Math.PI * duty);
  return ac.createPeriodicWave(re, im);
}
function env(g, t, peak, decay) { g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0008, t + decay); }

const METAL = [205.3, 304.4, 369.6, 522.7, 540, 800];   // the 808 hat's six detuned squares
function metal(t, dec, peak, hpF, mul, dest) {
  const g = ac.createGain(), bp = ac.createBiquadFilter(), hp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 10000; bp.Q.value = 0.7;
  hp.type = 'highpass'; hp.frequency.value = hpF;
  bp.connect(hp); hp.connect(g); g.connect(dest); env(g, t, peak, dec);
  for (const f of METAL) { const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f * mul; o.connect(bp); o.start(t); o.stop(t + dec + 0.02); }
}
function noiseHit(t, dec, peak, hpF, dest) {
  const n = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain();
  n.buffer = crunchBuf; hp.type = 'highpass'; hp.frequency.value = hpF;
  env(g, t, peak, dec); n.connect(hp); hp.connect(g); g.connect(dest);
  n.start(t, Math.random() * 0.5); n.stop(t + dec + 0.02);
}
function sweep(type, t, f0, f1, ft, peak, dec, dest) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + ft);
  env(g, t, peak, dec); o.connect(g); g.connect(dest); o.start(t); o.stop(t + dec + 0.02);
}

function playDrum(lane, t, vel, dest) {
  if (!ac) return;
  dest = dest || drumBus;
  vel = (vel || 1) * (0.92 + Math.random() * 0.16);
  if (lane === KICK) {
    sweep('sine', t, 165, 46, 0.11, 1.0 * vel, 0.34, dest);
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 2500; env(g, t, 0.5 * vel, 0.012);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + 0.03);
  } else if (lane === SNARE) {
    noiseHit(t, 0.17, 0.75 * vel, 1100, dest);
    sweep('triangle', t, 240, 160, 0.06, 0.7 * vel, 0.09, dest);
  } else if (lane === HAT) {
    metal(t, 0.045, 0.22 * vel, 7500, 1, dest);
  } else if (lane === TOM) {
    sweep('sine', t, 150, 92, 0.22, 0.95 * vel, 0.32, dest);
    sweep('triangle', t, 300, 180, 0.1, 0.25 * vel, 0.12, dest);
    noiseHit(t, 0.04, 0.15 * vel, 2500, dest);
  } else if (lane === CRASH) {
    metal(t, 1.3, 0.2 * vel, 5000, 1.35, dest);
    noiseHit(t, 1.1, 0.22 * vel, 6000, dest);
  }
}

function click(t, accent, dest) {
  const o = ac.createOscillator(), g = ac.createGain(), hp = ac.createBiquadFilter();
  o.type = 'square'; o.frequency.value = accent ? 2000 : 1500;
  hp.type = 'highpass'; hp.frequency.value = 800;
  g.gain.setValueAtTime(accent ? 0.22 : 0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  o.connect(hp); hp.connect(g); g.connect(dest || master); o.start(t); o.stop(t + 0.04);
}

function voice(e, t, r) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = 440 * Math.pow(2, (e.m - 69) / 12);
  let peak, sus, out = r.mus;
  if (e.v === 'bass') {
    const lp = ac.createBiquadFilter();
    o.type = 'square'; lp.type = 'lowpass'; lp.frequency.value = 650; lp.Q.value = 4;
    o.connect(lp); lp.connect(g); peak = 0.5; sus = 0.3;
  } else if (e.v === 'lead') {
    o.setPeriodicWave(pulse25); o.connect(g); out = r.lead; peak = 0.2; sus = 0.14;
    if (e.d > 0.3) {
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(18, t + 0.3);
      lfo.connect(lg); lg.connect(o.detune); lfo.start(t); lfo.stop(t + e.d + 0.05);
    }
  } else {
    o.setPeriodicWave(pulse125); o.connect(g); peak = 0.09; sus = 0.035;
  }
  const dec = Math.min(0.12, e.d * 0.5), hold = Math.max(e.d, 0.006 + dec);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.005);
  g.gain.exponentialRampToValueAtTime(sus, t + 0.005 + dec);
  g.gain.setValueAtTime(sus, t + hold);
  g.gain.linearRampToValueAtTime(0.0001, t + hold + 0.03);
  g.connect(out); o.start(t); o.stop(t + hold + 0.05);
}

function sfx(kind) {
  if (!ac || ac.state !== 'running') return;
  const seq = { move: [[880, 0.03]], ok: [[660, 0.04], [990, 0.07]], fever: [[523, 0.05], [659, 0.05], [784, 0.05], [1047, 0.14]] }[kind];
  let at = ac.currentTime;
  for (const [f, d] of seq) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.06, at); g.gain.exponentialRampToValueAtTime(0.001, at + d);
    o.connect(g); g.connect(master); o.start(at); o.stop(at + d + 0.01); at += d;
  }
}

// The context time that is coming out of the speakers at performance-clock time `ms`.
// Everything gameplay-related is judged on this clock, never on frame timing.
function audibleAt(ms) {
  if (!ac) return ms / 1000;
  if (ac.getOutputTimestamp) {
    const ts = ac.getOutputTimestamp();
    if (ts.performanceTime > 0 && Math.abs(ms - ts.performanceTime) < 150) return ts.contextTime + (ms - ts.performanceTime) / 1000;
  }
  return ac.currentTime - (ac.outputLatency || ac.baseLatency || 0) + (ms - performance.now()) / 1000;
}

// ============ CANVAS + PIXEL PRIMITIVES ============
const screenCv = document.getElementById('screen');
const sctx = screenCv.getContext('2d', { alpha: false });
const buf = document.createElement('canvas');
const g = buf.getContext('2d');

// ============ THE DRUMMER ============
// A small skeleton instead of a sprite sheet: every pose is computed from the same
// shoulders and the same kit, so frames can never drift out of registration.
const flashT = [-9, -9, -9, -9, -9];
const dr = { L: { drum: -1, t: -9 }, R: { drum: -1, t: -9 }, missT: -9 };
const tip = (tx, ty, deg) => { const a = deg * Math.PI / 180; return { hx: tx - Math.cos(a) * 10, hy: ty - Math.sin(a) * 10, a }; };
const hand = (hx, hy, deg) => ({ hx, hy, a: deg * Math.PI / 180 });
const POSE = {
  L: { sh: [28, 22], rest: hand(23, 32, 25), ready: hand(23, 25, -60),
    hit: { [SNARE]: tip(45, 31, 20), [TOM]: tip(29, 30, 20), [CRASH]: tip(13, 18, 150) } },
  R: { sh: [44, 22], rest: hand(49, 32, 155), ready: hand(49, 25, -120),
    hit: { [SNARE]: tip(47, 31, 155), [HAT]: tip(59, 25, 30), [TOM]: tip(30, 30, 160) } },
};

// Which arm takes which drum. Hats stay on the right arm and crash on the left;
// snare and tom go to whichever arm is free, crossing over when they have to.
function strike(lane, t) {
  if (lane === KICK) return;
  const A = dr.L, B = dr.R, busy = a => t - a.t < 0.07;
  if (lane === HAT) { if (busy(B) && B.drum === SNARE) { A.drum = SNARE; A.t = B.t; } B.drum = HAT; B.t = t; }
  else if (lane === CRASH) { if (busy(A) && A.drum === TOM) { B.drum = TOM; B.t = A.t; } A.drum = CRASH; A.t = t; }
  else if (lane === SNARE) { const a = busy(B) ? A : B; a.drum = SNARE; a.t = t; }
  else if (lane === TOM) { const a = busy(A) ? B : A; a.drum = TOM; a.t = t; }
}
function hitFx(lane) { const t = performance.now() / 1000; flashT[lane] = t; strike(lane, t); }

function lerpPose(a, b, f) {

}

  const P = POSE[side], arm = dr[side], hit = P.hit[arm.drum], dt = t - arm.t;
  const rest = bob ? { hx: P.rest.hx, hy: P.rest.hy + 1, a: P.rest.a } : P.rest;
  if (!hit || dt < 0 || dt > 0.45) return rest;
  if (dt < 0.05) return hit;
  if (dt < 0.15) return lerpPose(hit, P.ready, ease((dt - 0.05) / 0.1));

function elbow(sx, sy, hx, hy, side) {
  const L1 = 7, L2 = 7;

  const [ex, ey] = elbow(sh[0], sh[1], p.hx, p.hy, side);

  line(sh[0], sh[1], mx, my, C.shirt, 3, c);
  line(mx, my, ex, ey, C.skin, 2, c);
  line(ex, ey, p.hx, p.hy, C.skin, 2, c);

  rect(p.hx + ca * 10, p.hy + sa * 10, 1, 1, C.woodL, c);
  rect(Math.round(p.hx) - 1, Math.round(p.hy) - 1, 3, 2, C.skinD, c);
}

const HEAD = [[3, 33, 39], [4, 32, 40], [5, 31, 41], [6, 30, 42], [7, 30, 42], [8, 30, 42], [9, 30, 42], [10, 30, 42], [11, 30, 42], [12, 30, 42], [13, 31, 41], [14, 31, 41], [15, 32, 40], [16, 33, 39]];
const BEARD = [[11, 30, 31], [11, 41, 42], [12, 30, 32], [12, 40, 42], [13, 30, 42], [14, 30, 42], [15, 30, 42], [16, 31, 41], [17, 32, 40], [18, 33, 39], [19, 34, 38]];

function renderDrummer(beat, fever) {
  const c = sc2, t = performance.now() / 1000;
  c.clearRect(0, 0, 72, 64);
  const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  const Ln = (x0, y0, x1, y1, col, th) => line(x0, y0, x1, y1, col, th || 1, c);
  const age = l => t - flashT[l];
  const bob = beat != null && beat >= 0 && (beat % 1) < 0.22 ? 1 : 0;

  // stands
  Ln(12, 19, 12, 58, C.chromeD); Ln(12, 58, 8, 63, C.chromeD); Ln(12, 58, 16, 63, C.chromeD);
  Ln(60, 25, 60, 58, C.chromeD); Ln(60, 58, 56, 63, C.chromeD); Ln(60, 58, 64, 63, C.chromeD);
  Ln(51, 37, 53, 58, C.chromeD); Ln(53, 58, 50, 63, C.chromeD); Ln(53, 58, 57, 63, C.chromeD);

  // legs: the kick foot actually presses
  const kd = age(KICK) < 0.09 ? 2 : 0;
  Ln(31, 37, 24, 40 + kd, C.pants, 3); Ln(24, 40 + kd, 22, 57, C.pantsD, 3); R(18, 57 + (kd ? 1 : 0), 7, 3, C.ink);
  Ln(41, 37, 48, 40, C.pants, 3); Ln(48, 40, 50, 57, C.pantsD, 3); R(48, 57, 7, 3, C.ink);

  // torso
  R(28, 20, 17, 18, C.shirt); R(27, 22, 19, 15, C.shirt); R(30, 23, 2, 9, C.shirtL); R(42, 24, 1, 7, C.shirtL);

  // head, nodding on the beat
  const y = bob;
  R(33, 16 + y, 7, 5, C.skinD);
  for (const [r, a, b] of HEAD) R(a, r + y, b - a + 1, 1, C.skin);
  R(41, 6 + y, 2, 7, C.skinD); R(40, 4 + y, 1, 2, C.skinD);
  R(33, 5 + y, 2, 1, C.skinL); R(32, 6 + y, 1, 2, C.skinL);
  R(29, 9 + y, 1, 3, C.skinD); R(43, 9 + y, 1, 3, C.skinD);
  for (const [r, a, b] of BEARD) R(a, r + y, b - a + 1, 1, r >= 17 ? C.beardD : C.beard);
  R(36, 10 + y, 1, 2, C.skinD);
  R(35, 14 + y, 3, age(CRASH) < 0.3 ? 2 : 1, C.mouth);
  if (fever) {
    R(31, 8 + y, 5, 3, C.ink); R(37, 8 + y, 5, 3, C.ink); R(36, 9 + y, 1, 1, C.ink);
    R(32, 8 + y, 1, 1, C.white); R(38, 8 + y, 1, 1, C.white);
  } else {
    if (t - dr.missT < 0.4) { R(33, 8 + y, 1, 1, C.beard); R(34, 7 + y, 1, 1, C.beard); R(39, 8 + y, 1, 1, C.beard); R(38, 7 + y, 1, 1, C.beard); }
    else { R(33, 7 + y, 2, 1, C.beard); R(38, 7 + y, 2, 1, C.beard); }
    const blink = (t % 3.7) < 0.12;
    R(34, 9 + y, 1, blink ? 1 : 2, blink ? C.skinD : C.ink); R(38, 9 + y, 1, blink ? 1 : 2, blink ? C.skinD : C.ink);
  }

  // rack tom
  const ta = age(TOM), td = ta < 0.05 ? 1 : 0, tHead = ta < 0.1 ? C.blueL : C.head;
  Ln(34, 37, 36, 40, C.chromeD);
  R(24, 29 + td, 11, 1, tHead); R(23, 30 + td, 13, 1, tHead); R(23, 31 + td, 13, 1, C.chrome);
  R(23, 32 + td, 13, 5, C.shell); R(23, 32 + td, 2, 5, C.shellD); R(34, 32 + td, 2, 5, C.shellD); R(26, 33 + td, 1, 3, C.shellL);
  R(23, 37 + td, 13, 1, C.chromeD);

  // snare
  const sa = age(SNARE), sd = sa < 0.05 ? 1 : 0, sHead = sa < 0.1 ? C.redL : C.head;
  R(42, 30 + sd, 11, 1, sHead); R(41, 31 + sd, 13, 1, sHead); R(41, 32 + sd, 13, 1, C.chrome);
  R(41, 33 + sd, 13, 4, C.chromeD); R(43, 33 + sd, 1, 4, C.chrome); R(47, 34 + sd, 1, 2, C.chrome); R(51, 33 + sd, 1, 4, C.chrome);
  R(41, 37 + sd, 13, 1, C.chrome);

  // kick
  const ka = age(KICK), kp = ka < 0.05 ? 1 : 0;
  disc(36, 51, 12 + kp, C.shell, c);
  disc(36, 51, 10 + kp, ka < 0.1 ? C.orange : C.chrome, c);
  disc(36, 51, 9 + kp, ka < 0.1 ? C.orangeL : C.head, c);
  R(27, 42, 2, 1, C.shellL); R(26, 43, 1, 2, C.shellL);
  text('DH', 36, 48, C.shell, 1, 'center', null, c);
  Ln(26, 59, 22, 63, C.chromeD); Ln(46, 59, 50, 63, C.chromeD);

  // hi-hat: opens and rattles on a hit
  const ha = age(HAT), open = ha < 0.07 ? 1 : 0, rattle = ha < 0.25 ? Math.floor(ha * 40) % 2 : 0;
  Ln(60, 19, 60, 24, C.chrome);
  R(56, 23 - open - rattle, 9, 1, ha < 0.06 ? C.white : C.brassL); R(53, 24 - open, 15, 1, C.brass);
  R(53, 26, 15, 1, C.brassD); R(56, 27, 9, 1, C.brassD);

  // crash: rocks on its stand
  const ca = age(CRASH), tilt = ca < 0.6 ? Math.round(Math.sin(ca * 34) * 2 * (1 - ca / 0.6)) : 0;
  const shine = ca < 0.07 ? C.white : C.brassL;
  R(11, 16, 3, 1, C.brassD);
  R(7, 17 + tilt, 5, 1, shine); R(12, 17 - tilt, 6, 1, shine);
  R(4, 18 + tilt, 8, 1, C.brass); R(12, 18 - tilt, 9, 1, C.brass);
  R(5, 19 + tilt, 7, 1, C.brassD); R(12, 19 - tilt, 8, 1, C.brassD);
  if (ca < 0.1) { R(2, 15, 1, 1, C.white); R(21, 16, 1, 1, C.white); R(9, 14, 1, 1, C.yellowL); }

  drawArm(c, POSE.L.sh, armPose('L', t, bob), -1);
  drawArm(c, POSE.R.sh, armPose('R', t, bob), 1);
}

// ============ LAYOUT + CACHED SCENERY ============
let W = 0, H = 0, S = 1, OX = 0, OY = 0, L = null, PANEL = null, FULL = null, HWC = null, DIM = null;

function computeLayout() {
  const portrait = H > W * 1.05;
  L = { portrait };
  if (portrait) {
    const sh = Math.round(Math.min(H * 0.38, W * 0.85));
    L.stage = { x: 0, y: 0, w: W, h: sh };
    L.hw = { x: 0, y: sh, w: W, h: H - sh };
  } else {
    const sw = Math.round(Math.min(W * 0.45, H));
    L.stage = { x: 0, y: 0, w: sw, h: H };
    L.hw = { x: sw, y: 0, w: W - sw, h: H };
  }
  const hw = L.hw, D = 1.4;
  const hitY = H - 26, topY = hw.y + (portrait ? 14 : 24);
  let botW = Math.min(hw.w - 16, 240);
  botW -= botW % 4;
  L.g = { D, cx: Math.round(hw.x + hw.w / 2), hitY, topY, botW, topW: Math.round(botW / (1 + D)) };
}

function stageBg(w, h, fy, k, dx) {
  const cv = ditherGrad(w, h, [[0, C.ink], [fy / h * 0.5, C.night], [fy / h, C.plum], [Math.min(1, fy / h + 0.002), C.deep], [1, C.night]]);
  const x = cv.getContext('2d');
  x.globalAlpha = 0.22;
  for (let cx = 3; cx < w; cx += 8) rect(cx, 9, 2, fy - 9, C.ink, x);
  x.globalAlpha = 1;
  rect(3, 2, w - 6, 3, '#3a3352', x);
  for (let i = 5; i < w - 5; i += 4) rect(i, 3, 1, 1, '#5a5280', x);
  // amp cabinets either side of the riser, if they fit
  const cw = 18 * k, ch = 24 * k, kitW = 72 * k;
  for (const cx of [dx - cw - 8, dx + kitW + 8]) {
    if (cx < 2 || cx + cw > w - 2) continue;
    rect(cx, fy - ch, cw, ch, '#17131f', x); outline(cx, fy - ch, cw, ch, '#2c2640', x);
    for (const sy of [0.3, 0.72]) { disc(Math.round(cx + cw / 2), Math.round(fy - ch * sy), 5 * k, '#0c0a12', x); disc(Math.round(cx + cw / 2), Math.round(fy - ch * sy), 2 * k, '#2c2640', x); }
    rect(cx + 2 * k, fy - ch + 2 * k, 4 * k, k, C.mist, x);
  }
  // drum riser
  rect(dx - 6, fy + 1, kitW + 12, 5, '#2c2444', x);
  rect(dx - 6, fy + 1, kitW + 12, 1, C.violet, x);
  rect(0, fy, w, 1, C.violet, x);
  return cv;
}

function cone(w, h, lx, fy, cx, spread, col) {
  const cv = mk(w, h), x = cv.getContext('2d'), id = x.createImageData(w, h), d = id.data, c = rgb(col), top = 8;
  for (let y = top; y < Math.min(h, fy + 5); y++) {
    const f = Math.min(1, (y - top) / Math.max(1, fy - top));
    let l = lx + (cx - spread - lx) * f, r = lx + (cx + spread - lx) * f, level = 3 + f * 3;
    if (y > fy) { const s = 1 - (y - fy) / 5; l = cx - spread * s; r = cx + spread * s; level = 9; }
    for (let xx = Math.max(0, Math.floor(l)); xx < Math.min(w, Math.ceil(r)); xx++) {
      if (BAYER[(y & 3) * 4 + (xx & 3)] < level) { const o = (y * w + xx) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }
    }
  }
  x.putImageData(id, 0, 0);
  return cv;
}

function buildScene(r, floorY, k) {
  const dx = r.x + Math.round((r.w - 72 * k) / 2), dy = floorY - 63 * k, fy = floorY - r.y;
  const lamps = [0, 1, 2, 3, 4].map(i => Math.round(r.w * (i + 1) / 6));

function drawHighwayBase(fever) {

// ============ GAME STATE ============
let state = 'title', paused = false, run = null, res = null, shakeUntil = 0;
let titleCur = 0, selCur = settings.song, pauseCur = 0, resCur = 0;
const free = { metro: false, bpm: 100, spb: 0.6, t0: 0, next: 0, hits: [], offs: [], last: null };

const multOf = r => Math.min(4, 1 + Math.floor(r.combo / 10)) * (r.fever ? 2 : 1);

function startSong() {

  if (run) endRun();
  const song = SONGS[settings.song], speed = SPEEDS[settings.speed];
  const b = buildSong(song, settings.diff, speed);
  const cb = 4 * b.spb >= LOOK + 0.2 ? 4 : 8;
  const t0 = ac.currentTime + 0.25 + cb * b.spb;
  const clicks = [];
  for (let i = 0; i < cb; i++) clicks.push({ t: (i - cb) * b.spb, accent: i % 4 === 0 });

  const bus = ac.createGain(), mus = ac.createGain(), lead = ac.createGain();
  const dl = ac.createDelay(2), fb = ac.createGain(), lp = ac.createBiquadFilter(), wet = ac.createGain();
  bus.connect(master); mus.gain.value = 0.55; mus.connect(bus); lead.connect(mus);
  dl.delayTime.value = b.spb * 0.75; fb.gain.value = 0.28; lp.type = 'lowpass'; lp.frequency.value = 2800; wet.gain.value = 0.22;
  lead.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(mus);

    song, diff: settings.diff, speed, t0, clicks, ci: 0, mi: 0, ai: 0, nIdx: 0, bus, mus, lead,
    now: -cb * b.spb, score: 0, combo: 0, maxCombo: 0, counts: [0, 0, 0, 0], offs: [],
    hype: 0, fever: false, feverStart: 0, feverEnd: 0, pop: null, banner: null, done: false, autoplay: AUTOPLAY,
  });

function endRun() {
  if (!run) return;
  const bus = run.bus;
  bus.gain.setTargetAtTime(0, ac.currentTime, 0.03);
  setTimeout(() => { try { bus.disconnect(); } catch (e) { /* already gone */ } }, 500);
  if (paused) { paused = false; ac.resume(); }

}

function togglePause() {

  paused = !paused;
  if (paused) { pauseCur = 0; ac.suspend(); } else ac.resume();
}

function songNow() {
  if (paused) return run.now;
  const t = audibleAt(performance.now()) - run.t0;
  return t < run.now && run.now - t < 0.03 ? run.now : t;
}

function judge(n, off) {
  const r = run, a = Math.abs(off), q = a <= WIN.p ? 0 : a <= WIN.g ? 1 : 2;
  n.res = q + 1;
  r.counts[q]++; r.offs.push(off); r.combo++;

  r.pop = { text: ['PERFECT', 'GREAT', 'GOOD'][q], col: [C.cyan, C.lime, C.yellow][q], sub: q ? (off < 0 ? 'EARLY' : 'LATE') : null, t: performance.now() / 1000 };
  if (r.combo % 50 === 0) r.banner = { text: r.combo + ' COMBO!', col: C.yellow, t: performance.now() / 1000 };
  const G = L.g;
  if (n.lane === KICK) for (let i = 0; i < 4; i++) burst(laneX(i), G.hitY, C.orange, [4, 3, 2][q]);
  else burst(laneX(n.lane), G.hitY - 2, LANE_COL[n.lane], [14, 10, 6][q]);

function miss(n) {

  const fc = tot > 0 && m === 0, key = r.song.id + ':' + r.diff;

  if (state === 'play' && run && !paused && !run.autoplay) {

function updatePlay() {
  const r = run;
  r.now = songNow();
  if (paused) return;
  const now = r.now;
  if (r.autoplay) {
    for (let i = r.nIdx; i < r.notes.length; i++) {
      const n = r.notes[i];
      if (n.t > now) break;
      if (!n.res) { judge(n, 0); hitFx(n.lane); }
    }
  }
  while (r.nIdx < r.notes.length && r.notes[r.nIdx].res) r.nIdx++;
  for (let i = r.nIdx; i < r.notes.length; i++) {
    const n = r.notes[i];
    if (n.t >= now - WIN.ok) break;
    if (!n.res) miss(n);
  }
  if (r.fever && now >= r.feverEnd) { r.fever = false; r.hype = 0; }
  if (!r.done && now > r.end) { r.done = true; finish(); }
}

function drawPlay() {
  const r = run, now = r.now, G = L.g, vt = performance.now() / 1000;
  drawScene(PANEL, { beat: now >= 0 ? now / r.spb : null, crowd: true, hype: r.fever || r.combo >= 30, fever: r.fever });
  drawHighwayBase(r.fever);
  const b0 = Math.ceil(now / r.spb), b1 = Math.floor((now + LOOK) / r.spb);
  for (let b = b0; b <= b1; b++) beatLine((b * r.spb - now) / LOOK, b % 4 === 0);

  // notes, far to near so the closer ones overlap
  const notes = r.notes;
  let hi = r.nIdx;
  while (hi < notes.length && notes[hi].t <= now + LOOK) hi++;
  let lo = r.nIdx;
  while (lo > 0 && notes[lo - 1].t > now - 0.25) lo--;
  for (let i = hi - 1; i >= lo; i--) {
    const n = notes[i];
    if (n.res > 0) continue;
    const z = (n.t - now) / LOOK;
    if (z < -0.12 || z > 1) continue;
    const p = proj(z), dim = n.res === -1 || z > 0.92;
    if (p.y > G.hitY + 4) continue;
    if (n.lane === KICK) kickBar(p, dim);
    else gem(p.l + p.w / 4 * (n.lane + 0.5), p.y, p.w / 4, n.lane, dim);
  }
  drawPads();
  drawParts();

  // judgement + banners
  if (r.pop && vt - r.pop.t < 0.5) {

  const hw = L.hw, px = hw.x + 8, pw = hw.w - 32, py = hw.y + (L.portrait ? 4 : 14);

function histogram(cx, y, offs) {
  const bins = 25, bw = 4, w = bins * bw, x0 = Math.round(cx - w / 2), h = 22, counts = new Array(bins).fill(0);

  for (let i = 0; i < bins; i++) {

    if (bh) rect(x0 + i * bw, y + h - bh, bw - 1, bh, dist <= 3.5 ? C.cyan : dist <= 7.5 ? C.lime : C.yellow);

  text('EARLY', x0 - 5, y + h - 7, C.mist, 1, 'right', null);

}

function calStart() {

function calAdjust(d) { settings.calib = clamp(settings.calib + d, -250, 250); saveSettings(); sfx('move'); }
function updateCalib() {
  if (cal.phase !== 'run' || !ac || audibleAt(performance.now()) < cal.t0 + cal.n * cal.spb + 0.3) return;
  cal.phase = 'done';
  if (cal.offs.length >= 5) {
    const s = cal.offs.slice().sort((a, b) => a - b);
    settings.calib = clamp(Math.round(s[Math.floor(s.length / 2)] * 1000), -250, 250);
    saveSettings();
    cal.msg = 'MEASURED AND SAVED';
  } else {
    cal.msg = 'NOT ENOUGH TAPS - TRY AGAIN';
  }
}

  if (ay + 60 < H) text('ENTER START  < > ADJUST  ESC DONE', W / 2, H - 9, C.mist, 1, 'center', null);

// ============ INPUT ============
function menuKey(code) {
  const up = code === 'ArrowUp', down = code === 'ArrowDown', left = code === 'ArrowLeft', right = code === 'ArrowRight';
  const ok = code === 'Enter' || code === 'Space', back = code === 'Escape' || code === 'Backspace';
  if (state === 'title') {
    if (up || down) { titleCur = (titleCur + (down ? 1 : 2)) % 3; sfx('move'); }
    else if (ok) { sfx('ok'); TITLE_ITEMS[titleCur][1](); }
  } else if (state === 'select') {
    if (up || down) { selCur = (selCur + (down ? 1 : 6)) % 7; if (selCur < 4) { settings.song = selCur; saveSettings(); } sfx('move'); }
    else if (left || right) { if (selCur === 5) setSpeed(left ? 1 : -1); else setDiff(left ? -1 : 1); }
    else if (ok) { sfx('ok'); startSong(); }
    else if (back) state = 'title';
  } else if (state === 'results') {
    if (left || right) { resCur = 1 - resCur; sfx('move'); }
    else if (ok) RES_ITEMS[resCur][1]();
    else if (code === 'KeyR') RES_ITEMS[0][1]();
    else if (back) RES_ITEMS[1][1]();
  } else if (state === 'play' && paused) {
    if (up || down) { pauseCur = (pauseCur + (down ? 1 : 2)) % 3; sfx('move'); }
    else if (ok) PAUSE_ITEMS[pauseCur][1]();
  } else if (state === 'calib') {
    if (left || right) calAdjust(left ? -5 : 5);
    else if (code === 'Enter' && cal.phase !== 'run') calStart();
    else if (back) { cal.phase = 'idle'; state = 'title'; }
  }
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const code = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Backspace'].includes(code)) e.preventDefault();
  if (e.repeat) return;
  audioInit();
  const ms = e.timeStamp > 1e12 ? performance.now() : e.timeStamp;
  const lane = KEYMAP[code];
  if (state === 'play' && !paused) {
    if (code === 'Escape' || code === 'KeyP') togglePause();
    else if (lane !== undefined) padHit(lane, ms);
  } else if (state === 'play' && paused && (code === 'Escape' || code === 'KeyP')) {
    togglePause();
  } else if (state === 'free') {
    if (code === 'Escape') { setMetro(false); state = 'title'; }
    else if (code === 'KeyM') { setMetro(!free.metro); sfx('move'); }
    else if (code === 'ArrowUp' || code === 'ArrowRight') setBpm(5);
    else if (code === 'ArrowDown' || code === 'ArrowLeft') setBpm(-5);
    else if (lane !== undefined) padHit(lane, ms);
  } else if (state === 'calib' && lane !== undefined && cal.phase === 'run') {
    padHit(lane, ms);
  } else {
    menuKey(code);
  }
});

function zoneAt(x, y) {
  const G = L.g, st = L.stage;
  if (x >= st.x && x < st.x + st.w && y >= st.y && y < st.y + st.h) return KICK;
  if (y >= G.hitY + 13) return KICK;
  if (y >= G.hitY - (G.hitY - G.topY) * 0.6) {
    const l = Math.floor((x - (G.cx - G.botW / 2)) / (G.botW / 4));
    if (l >= 0 && l < 4) return l;
  }
  return null;
}

screenCv.addEventListener('pointerdown', e => {
  e.preventDefault();
  screenCv.focus();
  audioInit();
  const r = screenCv.getBoundingClientRect();
  const x = ((e.clientX - r.left) * (screenCv.width / r.width) - OX) / S;
  const y = ((e.clientY - r.top) * (screenCv.height / r.height) - OY) / S;
  for (const h of regions) if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) { h.fn(); return; }
  if ((state === 'play' && !paused) || state === 'free') {
    const lane = zoneAt(x, y);
    if (lane !== null) padHit(lane, e.timeStamp);
  } else if (state === 'calib' && cal.phase === 'run') {
    padHit(KICK, e.timeStamp);
  }
});

document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !paused) togglePause(); });
addEventListener('blur', () => { if (state === 'play' && !paused && run && !run.autoplay) togglePause(); });
addEventListener('resize', resize);

// ============ MAIN LOOP ============
let lastMs = performance.now();
function frame(ms) {
  const dt = Math.min(0.05, (ms - lastMs) / 1000);
  lastMs = ms;
  schedule();
  regions = [];
  updateParts(dt);
  if (state === 'title') drawTitle();
  else if (state === 'select') drawSelect();
  else if (state === 'play') { updatePlay(); if (state === 'play') drawPlay(); else drawResults(); }
  else if (state === 'results') drawResults();
  else if (state === 'free') drawFree();
  else if (state === 'calib') drawCalib();

  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = C.ink;
  sctx.fillRect(0, 0, screenCv.width, screenCv.height);
  let ox = OX, oy = OY;
  if (!reduceMotion && shakeUntil > performance.now() / 1000) { ox += (Math.random() < 0.5 ? -1 : 1) * S; oy += (Math.random() < 0.5 ? -1 : 1) * S; }
  sctx.drawImage(buf, 0, 0, W, H, ox, oy, W * S, H * S);
  requestAnimationFrame(frame);
}

// read-only handle for automated timing tests
if (/[?&]debug\b/.test(location.search)) window.__dh = { get run() { return run; }, get res() { return res; }, audibleAt };

resize();
requestAnimationFrame(frame);
})();
</script>
